# Release notes for GitHub releases, written by .github/workflows/release-notes.yml.
# Preview locally with: git cliff --unreleased --tag vX.Y.Z --strip all

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/portra400nc/CameraTools/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{% if previous.version %}
**Full Changelog**: [{{ previous.version }}...{{ version }}](https://github.com/portra400nc/CameraTools/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The comments set the order of the sections. Other commit types stay out of the notes.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = ".*", skip = true },
]
