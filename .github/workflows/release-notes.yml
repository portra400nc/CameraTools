name: Release notes

# Fills in the notes of every published release, including ones made on github.com.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-notes-${{ github.ref_name }}

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip all
        env:
          OUTPUT: NOTES.md

      - name: Write the notes to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --notes-file NOTES.md
